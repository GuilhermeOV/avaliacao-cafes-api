services:

  mysql:
    image: mysql:8.4
    container_name: cafes-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: avaliacao_cafes
      MYSQL_USER: cafes_user
      MYSQL_PASSWORD: cafes123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      retries: 20

  tomcat:
    image: tomcat:10.1-jdk17
    container_name: cafes-tomcat
    environment:
      DB_URL: jdbc:mysql://mysql:3306/avaliacao_cafes?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: cafes_user
      DB_PASSWORD: cafes123
      JWT_SECRET: troque-este-segredo-em-producao
      TZ: America/Sao_Paulo
    ports:
      - "8081:8080"
    volumes:
      - ./deploy:/usr/local/tomcat/webapps
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
